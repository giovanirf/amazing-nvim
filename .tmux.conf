# ~/.tmux.conf

set -g mouse on
set -g history-limit 100000

# Allow terminal to handle OSC sequences and URL clicks
set -g allow-passthrough on

# Correct terminal type for color and feature support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Faster escape for Vim/Neovim
set -sg escape-time 0

############################
# Pane navigation (Ctrl)
############################

# Move between panes with Ctrl + hjkl
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

############################
# Pane resizing (Ctrl + Shift)
############################

bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

############################
# Splits
############################

# prefix + | → vertical split
bind | split-window -h

# prefix + - → horizontal split
bind - split-window -v

# Copy to macOS clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Use vi-style keys in copy mode (since you use Vim)
setw -g mode-keys vi

############################
# Dark Theme (Catppuccin Mocha)
############################

# Status bar
set -g status on
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name with powerline separator
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa,nobold]"

# Right: date/time and hostname with powerline separator
set -g status-right "#[fg=#6c7086] %a %d %b  #[fg=#cdd6f4,bold]%H:%M  #[fg=#89b4fa,bg=#1e1e2e,nobold]#[bg=#89b4fa,fg=#1e1e2e,bold] #h "

# Window tabs
setw -g window-status-format "#[bg=#1e1e2e,fg=#6c7086]  #I  #W  "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold]  #I  #W  "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message / command prompt
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Copy mode highlight
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

############################
# Reload config
############################

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

